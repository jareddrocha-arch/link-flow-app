# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration
# Deploy extensions: shopify app deploy

# Must match the app merchants install (check Admin URL handle + appInstallation.apiKey)
name = "Link Flow Affiliates App"
client_id = "83757e483b8c48497463e2e97b377aff"
application_url = "https://link-flow-app-amber.vercel.app"
# Embedded in Shopify Admin — requires App Bridge CDN + session tokens
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# write_pixels + read_customer_events required for Web Pixel activation
# Minimal scopes: pixels + script tags for tracking; read_orders only for optional
# order webhook backup (IDs/amounts — no customer contact fields stored).
# We do not request read_customers or other customer PII scopes.
scopes = "read_orders,write_script_tags,write_pixels,read_customer_events"
# Shopify managed install (omit or false). Custom OAuth still works for brand-key installs.
use_legacy_install_flow = false

# Direct API Access for App Bridge authenticated Admin GraphQL from the iframe.
# Prevents console warnings when using shopify:admin/* fetch helpers.
[access.admin]
embedded_app_direct_api_access = true
direct_api_mode = "offline"

[auth]
redirect_urls = [
  "https://link-flow-app-amber.vercel.app/api/auth/callback",
  "http://localhost:3000/api/auth/callback"
]

[webhooks]
api_version = "2026-04"

  # Order webhooks (orders/paid, orders/create) need Protected Customer Data
  # approval first — register later via Admin API or re-add here after PCD access.
  # Thank-you tracking uses the Web Pixel instead.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://link-flow-app-amber.vercel.app/api/webhooks/shopify"

  # Mandatory compliance webhooks (App Store requirement).
  # All three topics share the same HTTPS endpoint; the handler verifies
  # X-Shopify-Hmac-SHA256 on the raw body before acknowledging with 200.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://link-flow-app-amber.vercel.app/api/webhooks/shopify"
